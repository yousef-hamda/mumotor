<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mumotor">
  <defs>
    <linearGradient id="mm-tile" x1="6" y1="3" x2="42" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A4338"/>
      <stop offset="0.55" stop-color="#6E3328"/>
      <stop offset="1" stop-color="#3A1713"/>
    </linearGradient>
    <linearGradient id="mm-wheel" x1="24" y1="9" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF3EC"/>
      <stop offset="1" stop-color="#E3D3C5"/>
    </linearGradient>
  </defs>
  <!-- clay tile -->
  <rect width="48" height="48" rx="13" fill="url(#mm-tile)"/>
  <!-- top sheen -->
  <rect width="48" height="22" rx="13" fill="#FFFFFF" opacity="0.07"/>
  <!-- steering wheel: ring + three spokes -->
  <g stroke="url(#mm-wheel)" stroke-width="2.9" stroke-linecap="round" fill="none">
    <circle cx="24" cy="25" r="12.4"/>
    <path d="M24 25 L24 36.2"/>
    <path d="M24 25 L14.7 20.0"/>
    <path d="M24 25 L33.3 20.0"/>
  </g>
  <!-- hub -->
  <circle cx="24" cy="25" r="4.2" fill="url(#mm-wheel)"/>
  <circle cx="24" cy="25" r="1.7" fill="#6E3328"/>
</svg>
