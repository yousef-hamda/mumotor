<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mumotor">
  <defs>
    <linearGradient id="mm-tile" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC74A"/>
      <stop offset="0.5" stop-color="#F2940B"/>
      <stop offset="1" stop-color="#E54E26"/>
    </linearGradient>
    <linearGradient id="mm-sun" x1="24" y1="11" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FFE9B8"/>
    </linearGradient>
    <clipPath id="mm-clip"><rect width="48" height="48" rx="13"/></clipPath>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#mm-tile)"/>
  <g clip-path="url(#mm-clip)">
    <!-- soft top highlight for a dimensional, non-flat tile -->
    <rect width="48" height="22" fill="#FFFFFF" opacity="0.16"/>
    <!-- rising sun over the horizon -->
    <circle cx="24" cy="19.5" r="6.6" fill="url(#mm-sun)"/>
    <!-- asphalt road in perspective, converging at the horizon -->
    <path d="M14.5 44 L22.4 24.5 H25.6 L33.5 44 Z" fill="#221C15" opacity="0.92"/>
    <!-- dashed centre lane line -->
    <path d="M24 27 L24 42" stroke="#FBC74A" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0.2 3.4"/>
  </g>
</svg>
