  tl.progress(1, true); tl.progress(0, true); tl.pause(0);

  const SHOTS=['wz_0.png','wz_1.png','wz_2.png','wz_3.png',

   'daily_report.png','logo_word.png','app_icon.png'];

  await Promise.all(SHOTS.map(s=>Promise.race([

    new Promise(res=>setTimeout(res,4000))
  ])));
  tl.time(0);
  window.ready=true;
})();
