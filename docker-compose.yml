services:
  postgres:
    image: postgres:16-alpine
    container_name: otto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: otto
      POSTGRES_PASSWORD: otto
      POSTGRES_DB: otto_driving
    ports:
      - "5432:5432"
    volumes:
      - otto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otto -d otto_driving"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: otto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - otto_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  otto_pgdata:
  otto_redisdata:
